# Builds and tests on every push/PR. Tagged commits (v*) are also sent to
# SignPath for signing and published as a GitHub release.
#
# One-time setup in the repository settings:
#   Secrets:   SIGNPATH_API_TOKEN       (SignPath CI user token)
#   Variables: SIGNPATH_ORGANIZATION_ID
#              SIGNPATH_PROJECT_SLUG    (e.g. kestrel-disk-imager)
#              SIGNPATH_POLICY_SLUG     (release-signing)
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: |
          python -m unittest discover -p "test_*.py" -v
          python tools/test_release.py -v

      - name: Build EXE
        run: python -m PyInstaller --noconfirm KestrelDiskImager.spec

      - name: Upload unsigned EXE
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: KestrelDiskImager-unsigned
          path: |
            dist/KestrelDiskImager.exe
            LICENSE
            assets/ICON-LICENSE.txt
          if-no-files-found: error

  sign:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Submit signing request to SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Check signature
        shell: pwsh
        run: |
          $s = Get-AuthenticodeSignature signed/dist/KestrelDiskImager.exe
          $s | Format-List Status, SignerCertificate, TimeStamperCertificate
          if ($s.Status -ne 'Valid' -or -not $s.TimeStamperCertificate) { exit 1 }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            signed/dist/KestrelDiskImager.exe
            signed/LICENSE
